; Production PHP settings for the API image (apps/api/Dockerfile.prod).
; Opcache is the main throughput win for the demo's single web process.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0

; Keep uploads/requests modest for a free-tier demo.
memory_limit=256M
upload_max_filesize=8M
post_max_size=10M
expose_php=0
