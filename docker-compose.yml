# Dev stack for the AI Helpdesk monorepo.
# Bring everything up with:  docker compose up
# Services run as UID 1000 so bind-mounted files stay owned by you (enjay).

services:
  # PostgreSQL with the pgvector extension pre-installed (needed later for RAG).
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis — used for queues/Horizon in later phases.
  redis:
    image: redis:7-alpine
    # Host port 6380 -> container 6379 (host's 6379 is already taken).
    # The api container still reaches it as redis:6379 over the internal network.
    ports:
      - "6380:6379"

  # Laravel 12 REST API.
  api:
    build: ./apps/api
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/var/www/api
    environment:
      HOME: /tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Queue worker — processes the non-blocking jobs that intake dispatches
  # (ticket classification, KB auto-resolve). Without this, queued jobs pile up
  # in the `jobs` table and tickets are never classified. Shares the api image
  # and code mount; runs a separate process so intake stays non-blocking.
  worker:
    build: ./apps/api
    user: "1000:1000"
    volumes:
      - ./apps/api:/var/www/api
    environment:
      HOME: /tmp
    # Restart until the api container finishes composer install + migrate (it
    # creates the `jobs` table); queue:work exits on a missing table and we
    # come straight back up. The jobs themselves already fail-soft.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
    # Wait for shared deps to be installed by the api container, then work the
    # queue. --tries retries transient job failures; --max-time recycles the
    # worker hourly so code changes are picked up in dev.
    command: >
      sh -c "until [ -f vendor/autoload.php ]; do echo 'waiting for composer deps...'; sleep 2; done &&
             php artisan queue:work --tries=3 --sleep=3 --timeout=60 --max-time=3600"

  # Vue 3 + TypeScript SPA (Vite dev server).
  web:
    build: ./apps/web
    user: "1000:1000"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
    environment:
      HOME: /tmp
    depends_on:
      - api

volumes:
  db-data:
